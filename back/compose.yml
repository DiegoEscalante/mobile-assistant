services:
  assistant:
    build: .
    container_name: assistant
    restart: unless-stopped
    ports: 
      - "8000:8000"
    volumes:
      - ./app:/app
    networks:
      - ai_default
      - assistant-internal
    depends_on:
      - postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  postgres:
    image: postgres:18.6
    container_name: assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ai_default
    

networks:
  ai_default:
    external: true

  assistant-internal:

volumes:
  postgres_data: